name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Put the action on a key...
        2. Press the key...
        3. See error...
    validations:
      required: true

  - type: input
    id: iracedeck-version
    attributes:
      label: iRaceDeck version
      placeholder: e.g. 3.9.0

  - type: input
    id: iracing-version
    attributes:
      label: iRacing version
      placeholder: e.g. 2025 Season 2 Patch 3

  - type: input
    id: stream-deck
    attributes:
      label: Deck model and host software version
      description: A Stream Deck with the Stream Deck software, a Mirabox deck with HotSpot StreamDock or VSD Craft, or a Ulanzi Deck with UlanziStudio.
      placeholder: e.g. Stream Deck MK.2, Stream Deck software 7.1

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant lines from the iRaceDeck plugin's logs folder.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, screen recordings, or anything else that might help.
