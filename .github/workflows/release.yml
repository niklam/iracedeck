name: Release

on:
  push:
    # A digit after the v: voice-pack releases are tagged voices-<id>-<version>
    # (#1116), which a bare v* would also match. Tags the workflow itself
    # creates with GITHUB_TOKEN never trigger runs, but one pushed by hand
    # with a personal token would, and it must not package the plugins.
    tags: ["v[0-9]*"]

permissions:
  checks: write
  contents: write
  pull-requests: write

jobs:
  build-plugins:
    # No custom secrets needed — the packaging workflow only uses the
    # auto-provided GITHUB_TOKEN (for the release upload), so don't inherit.
    uses: ./.github/workflows/release-pack.yml
  deploy-website:
    needs: [build-plugins]
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/firebase-hosting-release.yml
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
