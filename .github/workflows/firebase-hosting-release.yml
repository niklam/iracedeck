name: Deploy to Firebase Hosting on release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g., v1.7.0) — optional for manual runs"
        type: string
  workflow_call:
    inputs:
      version:
        description: "Release version tag (e.g., v1.7.0)"
        required: true
        type: string
      # Both optional, used only by publish-voice-packs.yml (#1116): build the
      # site from `ref` (the latest stable plugin tag) rather than the calling
      # ref, then overlay packages/audio-assets/catalog/ from `catalog_ref` —
      # the master commit whose catalog the caller verified (#1392). A voice
      # pack published between releases must move the catalog without
      # deploying master's documentation for unreleased work.
      ref:
        description: "Git ref to build the site from (default: the calling ref)"
        required: false
        type: string
      catalog_ref:
        description: "Commit whose packages/audio-assets/catalog/ overlays the checkout; refused unless master's catalog is still the same"
        required: false
        type: string

# The deploy needs the checkout and the Firebase service account; nothing here
# writes to GitHub. A caller (release.yml, publish-voice-packs.yml) may hold
# more, but a called workflow can only lower the cap, never raise it.
permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # One live deploy at a time, from every caller (#1392). The overlay below
    # checks master's catalog and the deploy follows minutes later; without
    # this, an older run that passed its check could finish after a newer one
    # and put its catalog back. Queued, never cancelled in flight: GitHub
    # keeps one pending run per group, so a third deploy replaces the pending
    # one, which then shows as cancelled and is dispatched again if needed.
    concurrency:
      group: firebase-hosting-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # `--no-overlay` so a pack withdrawn on master (its entry deleted) is
      # removed here too; the default overlay mode only adds and overwrites.
      # The one exception is deliberate (#1392): withdrawing the LAST pack
      # deletes the directory, which this step refuses below rather than put
      # an empty, unverified catalog live; that ships with the next tag.
      # The checkout must also be able to BUILD a catalog: a tag older than
      # the catalog generator would deploy green with no catalog at all.
      #
      # The overlay is the catalog at `catalog_ref`, the commit the caller's
      # pack job verified, and only while master's catalog is still that very
      # tree (#1392). The caller pins the commit so a push landing mid-run
      # cannot slip an unverified entry in; the comparison is what stops the
      # pin from regressing the site, since a re-run keeps its original commit
      # and would otherwise put an older catalog back over a newer one. It
      # lives here, in the deploying job, because re-running this job alone
      # skips every check in the caller's jobs. Master is named here rather
      # than passed in so that no caller can leave the check out.
      # scripts/voice-pack-publish-workflow.test.mjs runs this script.
      - name: Overlay the voice-pack catalog from another ref
        if: inputs.catalog_ref
        env:
          CATALOG_REF: ${{ inputs.catalog_ref }}
        run: |
          set -euo pipefail
          catalog_dir=packages/audio-assets/catalog
          test -f scripts/lib/voice-catalog-data.mjs || {
            echo "::error::$(git describe --tags --always) has no voice-catalog generator; a catalog overlay cannot be built from it."
            exit 1
          }
          git fetch --no-tags --depth=1 origin "$CATALOG_REF"
          catalog_commit="$(git rev-parse FETCH_HEAD)"
          git fetch --no-tags --depth=1 origin refs/heads/master
          master_commit="$(git rev-parse FETCH_HEAD)"
          catalog_tree="$(git rev-parse --verify --quiet "$catalog_commit:$catalog_dir" || true)"
          master_tree="$(git rev-parse --verify --quiet "$master_commit:$catalog_dir" || true)"
          if [ -z "$catalog_tree" ]; then
            echo "::error::$catalog_commit has no $catalog_dir; there is no catalog to deploy."
            exit 1
          fi
          if [ "$catalog_tree" != "$master_tree" ]; then
            echo "::error::master's $catalog_dir has changed since $catalog_commit, the commit this run verified (master is at $master_commit). Deploying it would put a catalog live that master no longer holds, or one nothing verified. Dispatch 'Publish voice packs' again from master."
            exit 1
          fi
          git checkout --no-overlay "$catalog_commit" -- "$catalog_dir"
          echo "Catalog overlaid from $catalog_commit, which master's catalog still matches (master at $master_commit)."
          git status --short "$catalog_dir"

      # The pnpm version follows the checked-out ref, not this file: a voice-pack
      # publish builds the latest stable tag with the workflow from master, and
      # a tag from before #1245 needs pnpm 10 (its settings live in package.json,
      # which pnpm 11+ ignores). `version` stays explicit rather than left for
      # the action to read — see #386.
      - name: Read the checkout's pnpm pin
        id: pnpm-pin
        # `pnpm@x.y.z` or corepack's `pnpm@x.y.z+sha512.…`; the action compares the bare version.
        run: echo "version=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-pin.outputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install

      # The site must never go live naming a voice-pack archive that does not
      # exist (#1116). On the release path the archive was attached by the
      # build job this deploy waits for; on a manual dispatch nothing
      # guarantees it, so every entry's url is asked before the build. A
      # tag from before the catalog existed has no entries and passes.
      - name: Verify every voice-pack archive the catalog names is published
        run: |
          set -euo pipefail
          shopt -s nullglob
          for entry in packages/audio-assets/catalog/*.json; do
            url="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).url' "$entry")"
            if ! code="$(curl -sSIL --connect-timeout 15 --max-time 60 -o /dev/null -w '%{http_code}' "$url")"; then
              echo "::error file=$entry::The request for $url failed or timed out."
              exit 1
            fi
            if [ "$code" != "200" ]; then
              echo "::error file=$entry::$entry names $url, which answers HTTP $code. Publish the archive first (the release workflow, or 'Publish voice packs' with publish on), or restore the entry."
              exit 1
            fi
            echo "ok  $entry -> $url"
          done

      - name: Build website
        run: pnpm exec turbo run build --filter=@iracedeck/website
        env:
          PUBLIC_IRACEDECK_VERSION: ${{ inputs.version || '' }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRACEDECK }}
          channelId: live
          projectId: iracedeck
          entryPoint: packages/website
