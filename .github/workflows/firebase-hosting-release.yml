name: Deploy to Firebase Hosting on release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g., v1.7.0) — optional for manual runs"
        type: string
  workflow_call:
    inputs:
      version:
        description: "Release version tag (e.g., v1.7.0)"
        required: true
        type: string
      # Both optional, used only by publish-voice-packs.yml (#1116): build the
      # site from `ref` (the latest stable plugin tag) rather than the calling
      # ref, then overlay packages/audio-assets/catalog/ from `catalog_ref` —
      # the master commit whose catalog the caller verified (#1392). A voice
      # pack published between releases must move the catalog without
      # deploying master's documentation for unreleased work.
      ref:
        description: "Git ref to build the site from (default: the calling ref)"
        required: false
        type: string
      catalog_ref:
        description: "Commit whose packages/audio-assets/catalog/ overlays the checkout; refused unless master's catalog is still the same"
        required: false
        type: string

# The deploy needs the checkout and the Firebase service account; nothing here
# writes to GitHub. A caller (release.yml, publish-voice-packs.yml) may hold
# more, but a called workflow can only lower the cap, never raise it.
permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # One catalog-overlay deploy at a time (#1392). The overlay below checks
    # master's catalog and the deploy follows minutes later; without this, an
    # older publish that passed its check could finish after a newer one and
    # put its catalog back. Queued, never cancelled in flight. GitHub keeps
    # one PENDING run per group and cancels the older when a third arrives,
    # so the group is per kind of caller: a newer publish only ever replaces
    # an older publish, whose packs its own verified catalog already carries,
    # and a tag release only an older release. One shared group would let a
    # release evict a pending publish and leave its new archive unoffered.
    concurrency:
      group: firebase-hosting-live-${{ inputs.catalog_ref && 'catalog-overlay' || 'release' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # `--no-overlay` so a pack withdrawn on master (its entry deleted) is
      # removed here too; the default overlay mode only adds and overwrites.
      # Removed here is not removed live: the check before the deploy (#1613)
      # refuses any deploy, this path's or a tag's, that lacks a pack the live
      # catalog still lists, so a live pack is not withdrawn through this
      # workflow at all. Withdrawing the LAST pack deletes the directory, which
      # this step refuses outright (#1392) rather than put an empty, unverified
      # catalog live.
      # The checkout must also be able to BUILD a catalog: a tag older than
      # the catalog generator would deploy green with no catalog at all.
      #
      # The overlay is the catalog at `catalog_ref`, the commit the caller's
      # pack job verified, and only while master's catalog is still that very
      # tree (#1392). The caller pins the commit so a push landing mid-run
      # cannot slip an unverified entry in; the comparison is what stops the
      # pin from regressing the site, since a re-run keeps its original commit
      # and would otherwise put an older catalog back over a newer one. It
      # lives here, in the deploying job, because re-running this job alone
      # skips every check in the caller's jobs. Master is named here rather
      # than passed in so that no caller can leave the check out.
      # scripts/voice-pack-publish-workflow.test.mjs runs this script.
      - name: Overlay the voice-pack catalog from another ref
        if: inputs.catalog_ref
        env:
          CATALOG_REF: ${{ inputs.catalog_ref }}
        run: |
          set -euo pipefail
          catalog_dir=packages/audio-assets/catalog
          test -f scripts/lib/voice-catalog-data.mjs || {
            echo "::error::$(git describe --tags --always) has no voice-catalog generator; a catalog overlay cannot be built from it."
            exit 1
          }
          git fetch --no-tags --depth=1 origin "$CATALOG_REF"
          catalog_commit="$(git rev-parse FETCH_HEAD)"
          git fetch --no-tags --depth=1 origin refs/heads/master
          master_commit="$(git rev-parse FETCH_HEAD)"
          catalog_tree="$(git rev-parse --verify --quiet "$catalog_commit:$catalog_dir" || true)"
          master_tree="$(git rev-parse --verify --quiet "$master_commit:$catalog_dir" || true)"
          if [ -z "$catalog_tree" ]; then
            echo "::error::$catalog_commit has no $catalog_dir; there is no catalog to deploy."
            exit 1
          fi
          if [ "$catalog_tree" != "$master_tree" ]; then
            echo "::error::master's $catalog_dir has changed since $catalog_commit, the commit this run verified (master is at $master_commit). Deploying it would put a catalog live that master no longer holds, or one nothing verified. Dispatch 'Publish voice packs' again from master."
            exit 1
          fi
          git checkout --no-overlay "$catalog_commit" -- "$catalog_dir"
          echo "Catalog overlaid from $catalog_commit, which master's catalog still matches (master at $master_commit)."
          git status --short "$catalog_dir"

      # The pnpm version follows the checked-out ref, not this file: a voice-pack
      # publish builds the latest stable tag with the workflow from master, and
      # a tag from before #1245 needs pnpm 10 (its settings live in package.json,
      # which pnpm 11+ ignores). `version` stays explicit rather than left for
      # the action to read — see #386.
      - name: Read the checkout's pnpm pin
        id: pnpm-pin
        # `pnpm@x.y.z` or corepack's `pnpm@x.y.z+sha512.…`; the action compares the bare version.
        run: echo "version=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-pin.outputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install

      # The site must never go live naming a voice-pack archive that does not
      # exist (#1116). On the release path the archive was attached by the
      # build job this deploy waits for; on a manual dispatch nothing
      # guarantees it, so every entry's url is asked before the build. A
      # tag from before the catalog existed has no entries and passes.
      - name: Verify every voice-pack archive the catalog names is published
        run: |
          set -euo pipefail
          shopt -s nullglob
          for entry in packages/audio-assets/catalog/*.json; do
            url="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).url' "$entry")"
            if ! code="$(curl -sSIL --connect-timeout 15 --max-time 60 -o /dev/null -w '%{http_code}' "$url")"; then
              echo "::error file=$entry::The request for $url failed or timed out."
              exit 1
            fi
            if [ "$code" != "200" ]; then
              echo "::error file=$entry::$entry names $url, which answers HTTP $code. Publish the archive first (the release workflow, or 'Publish voice packs' with publish on), or restore the entry."
              exit 1
            fi
            echo "ok  $entry -> $url"
          done

      - name: Build website
        run: pnpm exec turbo run build --filter=@iracedeck/website
        env:
          PUBLIC_IRACEDECK_VERSION: ${{ inputs.version || '' }}

      # The catalog this deploys must not be behind the one already live
      # (#1613). A tag release deploys the tag's catalog, and a patch tagged
      # from a release branch cut before a voice-pack bump would put the older
      # entry live over the newer one a between-releases publish deployed, with
      # everything green, since the older archive is still published. So every
      # pack in the live catalog must be here at or above its live version
      # (semver precedence). A pack only here never blocks; a live pack missing
      # here refuses, since deploying would remove it. Every problem is
      # reported, then the job fails before anything deploys.
      #
      # The base is the live catalog, not master's. Master routinely carries a
      # committed pack bump that is not live yet, so comparing with master
      # refused ordinary patch releases although nothing live regressed (the
      # spec's amendment). The live catalog is the state this protects. It
      # runs on every deploy, the publish path's too, where it stops a publish
      # from master taking back a pack a release put live ahead of master.
      #
      # It is the job's last step before the deploy. It must be in this job,
      # because re-running this job alone skips every check in the caller's
      # jobs. And it reads the live catalog last because release deploys and
      # publish deploys are in separate concurrency groups: a publish can go
      # live while this job installs and builds, and a check made before that
      # would pass a catalog the publish has since overtaken. Only the deploy
      # itself is left in that window. It is inline rather than a script under
      # scripts/ because the publish path runs this file from master against
      # an older stable tag's checkout, which would not carry a new script.
      # The URL is a literal here, not an input, so no caller can point the
      # comparison elsewhere.
      #
      # A 404 is the one pass without a comparison: no catalog is live, so
      # nothing can regress, and a warning says so. Everything else fails
      # closed: a network error, a timeout, any other status, and a 200 whose
      # body is not the schema-1 catalog (an unknown schema included, since
      # this step must follow a change to the format). Accepting a catalog
      # nobody compared is the failure this exists to stop, and a skipped
      # deploy would read green. The accepted cost: while the live catalog
      # answers 200 with a body this cannot read, no deploy through this
      # workflow can replace it until the site is repaired by hand.
      # scripts/voice-pack-tag-catalog-workflow.test.mjs runs this script.
      - name: Refuse a voice-pack catalog behind the live one
        env:
          LIVE_CATALOG_URL: https://iracedeck.com/voice-catalog.json
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import { existsSync, readFileSync } from "node:fs";

          const url = process.env.LIVE_CATALOG_URL;
          const dir = "packages/audio-assets/catalog";
          // The pack-id rule of the voice-pack schema; it also keeps a live id from naming a path outside `dir`.
          const PACK_ID = /^[a-z][a-z0-9-]*$/;

          // semver.org 2.0.0, after trimming and one optional leading "v".
          const SEMVER =
            /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+[0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*)?$/;
          function parseVersion(value) {
            if (typeof value !== "string") return null;
            const m = SEMVER.exec(value.trim().replace(/^v/, ""));
            if (!m) return null;
            return { core: [BigInt(m[1]), BigInt(m[2]), BigInt(m[3])], pre: m[4] === undefined ? [] : m[4].split(".") };
          }
          const order = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
          function compareIdentifiers(a, b) {
            const an = /^\d+$/.test(a);
            const bn = /^\d+$/.test(b);
            if (an && bn) return order(BigInt(a), BigInt(b));
            if (an !== bn) return an ? -1 : 1;
            return order(a, b);
          }
          // Precedence: the core numerically, then a release above its
          // pre-releases, then identifier by identifier, a shorter list with an
          // equal prefix ranking lower. Build metadata never counts.
          function compareVersions(a, b) {
            for (let i = 0; i < 3; i++) if (a.core[i] !== b.core[i]) return order(a.core[i], b.core[i]);
            if (a.pre.length === 0 || b.pre.length === 0) return order(b.pre.length, a.pre.length);
            for (let i = 0; i < Math.max(a.pre.length, b.pre.length); i++) {
              if (i === a.pre.length) return -1;
              if (i === b.pre.length) return 1;
              const c = compareIdentifiers(a.pre[i], b.pre[i]);
              if (c !== 0) return c;
            }
            return 0;
          }

          // Workflow-command escaping, so a stray character in a value cannot end the annotation.
          const escapeData = (s) => String(s).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
          const escapeProperty = (s) => escapeData(s).replace(/:/g, "%3A").replace(/,/g, "%2C");
          const shown = (v) => (v === undefined ? `no "version"` : `version ${JSON.stringify(v)}, which is not a semver version`);
          const shownValue = (v) => (v === undefined ? "absent" : JSON.stringify(v));
          const reasonOf = (error) => {
            const cause = error?.cause;
            const detail = cause?.code ?? cause?.message;
            return detail ? `${error.message}: ${detail}` : String(error?.message ?? error);
          };
          // exitCode rather than exit(), so no output is cut short on a pipe.
          const fail = (message) => {
            console.log(`::error::${escapeData(message)}`);
            process.exitCode = 1;
          };
          const unread = "Refusing to deploy a catalog nobody compared with the live one";
          const malformed = (reason) =>
            fail(`The live voice-pack catalog at ${url} cannot be read as the catalog: ${reason}. ${unread}; until the live catalog reads as schema 1 again, no deploy through this workflow can replace it.`);
          const remedy = (id) =>
            `Bring pack "${id}" from master onto the release branch this deploys, its clips and its catalog entry together (the tag's pack job repacks from the branch's clips and verifies the archive against the entry), then re-tag, or re-run once the branch carries them.`;

          async function main() {
            if (!url) return fail(`LIVE_CATALOG_URL is not set, so there is no live catalog to compare with. ${unread}.`);
            const timeoutText = process.env.LIVE_CATALOG_TIMEOUT_MS ?? "30000";
            if (!/^[1-9]\d*$/.test(timeoutText))
              return fail(`LIVE_CATALOG_TIMEOUT_MS is ${JSON.stringify(timeoutText)}, not a whole number of milliseconds. ${unread}.`);
            const timeoutMs = Number(timeoutText);

            let response;
            let body;
            try {
              // Redirects are followed, and the status judged is the final one.
              response = await fetch(url, { signal: AbortSignal.timeout(timeoutMs), headers: { accept: "application/json" } });
              if (response.status === 200) body = await response.text();
              else await response.body?.cancel();
            } catch (error) {
              const reason = error?.name === "TimeoutError" ? `no complete answer within ${timeoutMs} ms` : reasonOf(error);
              return fail(`The live voice-pack catalog at ${url} could not be read (${reason}). ${unread}; re-run once it answers.`);
            }
            const where = response.redirected ? ` (redirected to ${response.url})` : "";
            if (response.status === 404) {
              console.log(`::warning::${escapeData(`The live voice-pack catalog at ${url} answered HTTP 404${where}: no catalog is live, so no pack can regress. Nothing was compared.`)}`);
              return;
            }
            if (response.status !== 200)
              return fail(`The live voice-pack catalog at ${url} answered HTTP ${response.status}${where}. ${unread}; re-run once it answers 200, or 404 when no catalog is live.`);

            let doc;
            try {
              doc = JSON.parse(body);
            } catch (error) {
              return malformed(`its body is not JSON (${error.message})`);
            }
            if (doc === null || typeof doc !== "object" || Array.isArray(doc)) return malformed("its body is not a JSON object");
            if (doc.schema !== 1)
              return malformed(`its "schema" is ${shownValue(doc.schema)}, not 1 (this step reads schema 1 and must follow a change to the format)`);
            if (!Array.isArray(doc.packs)) return malformed(`its "packs" is ${shownValue(doc.packs)}, not an array`);
            const shape = [];
            const seen = new Set();
            doc.packs.forEach((pack, i) => {
              if (pack === null || typeof pack !== "object" || Array.isArray(pack)) shape.push(`packs[${i}] is not an object`);
              else if (typeof pack.id !== "string" || !PACK_ID.test(pack.id)) shape.push(`packs[${i}] has id ${shownValue(pack.id)}, not a pack id`);
              else if (seen.has(pack.id)) shape.push(`packs[${i}] repeats pack id "${pack.id}"`);
              else seen.add(pack.id);
            });
            if (shape.length > 0) return malformed(shape.join("; "));

            const problems = [];
            const refuse = (id, message) => problems.push(`::error file=${escapeProperty(`${dir}/${id}.json`)}::${escapeData(message)}`);
            let compared = 0;
            for (const { id, version: liveVersion } of doc.packs) {
              const file = `${dir}/${id}.json`;
              const liveParsed = parseVersion(liveVersion);
              if (!liveParsed) {
                refuse(id, `The live catalog (${url}) lists pack "${id}" with ${shown(liveVersion)}, so it cannot be compared. ${unread}.`);
                continue;
              }
              if (!existsSync(file)) {
                refuse(id, `Voice pack "${id}" is missing in this deploy but live at ${liveVersion} (${url}); deploying would remove a live pack. ${remedy(id)}`);
                continue;
              }
              let entry;
              try {
                entry = JSON.parse(readFileSync(file, "utf8"));
              } catch (error) {
                refuse(id, `${file} in this deploy could not be read as JSON (${error.message}), so pack "${id}" cannot be compared with its live ${liveVersion} (${url}). ${unread}.`);
                continue;
              }
              const version = entry?.version;
              const parsed = parseVersion(version);
              if (!parsed) {
                refuse(id, `${file} in this deploy has ${shown(version)}, so pack "${id}" cannot be compared with its live ${liveVersion} (${url}). ${unread}.`);
                continue;
              }
              if (compareVersions(parsed, liveParsed) < 0) {
                refuse(id, `Voice pack "${id}" is at ${version} in this deploy but live at ${liveVersion} (${url}); deploying would put the older entry live over the newer one. ${remedy(id)}`);
                continue;
              }
              compared++;
              console.log(`ok  ${id}  ${version} >= ${liveVersion}`);
            }

            if (problems.length > 0) {
              for (const line of problems) console.log(line);
              return fail(`${problems.length} voice-pack catalog ${problems.length === 1 ? "entry" : "entries"} in this deploy cannot be deployed against the live catalog (${url}); see above.`);
            }
            console.log(`Every voice pack in the live catalog (${url}) is in this deploy at or above its live version: ${compared} compared.`);
          }

          main().catch((error) => fail(`The catalog check failed unexpectedly (${reasonOf(error)}). ${unread}.`));
          JS

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRACEDECK }}
          channelId: live
          projectId: iracedeck
          entryPoint: packages/website
