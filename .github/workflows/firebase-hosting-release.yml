name: Deploy to Firebase Hosting on release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g., v1.7.0) — optional for manual runs"
        type: string
  workflow_call:
    inputs:
      version:
        description: "Release version tag (e.g., v1.7.0)"
        required: true
        type: string

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Force GitHub's runner to execute JavaScript actions on Node 24. The Firebase
    # deploy action below still declares `using: node20`, which GitHub has deprecated:
    # Node 20 actions are forced to Node 24 from 2026-06-02 and Node 20 is removed
    # from runners on 2026-09-16. Opting in early verifies the action runs under
    # Node 24 before the forced cutover. Remove this once
    # FirebaseExtended/action-hosting-deploy ships a Node 24 release (issue #388).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install

      - name: Build website
        run: pnpm --filter @iracedeck/website build
        env:
          PUBLIC_IRACEDECK_VERSION: ${{ inputs.version || '' }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRACEDECK }}
          channelId: live
          projectId: iracedeck
          entryPoint: packages/website
