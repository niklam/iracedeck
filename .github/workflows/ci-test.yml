name: Tests

# Also runs on pushes to master and release branches. A pull_request check only
# proves something about the branch merged against the master that existed when
# it ran, never about the master that results — and under squash-merge that
# result is a tree nothing has ever built or tested (#1070). Matches the
# branch list ci-typecheck.yml already uses, for the reason stated there:
# release branches take feature PRs of their own and reach master through a
# back-merge, so a post-merge gap there is the same gap one branch removed.
on:
  pull_request:
  push:
    branches: [master, 'release/*']
    # A push that changes only spec documents runs nothing (#1466): specs
    # commit straight to master as their own docs(specs) commits, and no step
    # of the four CI workflows reads one but ci-test's control-byte scan,
    # which the husky pre-commit hook runs on staged specs instead
    # (scripts/check-staged-spec-bytes.mjs). Any other change
    # still runs, a non-Markdown file under specs/ included: lint and format
    # read it.
    paths-ignore:
      - 'docs/superpowers/specs/**.md'

# No `concurrency` group: a superseded PR run is cancelled by
# cancel-superseded.yml instead, so a new run never waits for an old one to
# finish cancelling (#1506).

# This job only reads the repository, so it gets the minimum token scope and the
# checkout credential is not left in .git/config for later steps to reach.
permissions:
  contents: read

jobs:
  # The suite runs in three shards (#1492). Vitest splits by file count, not by
  # duration, so the balance is worth re-checking when the suite grows. Each
  # shard builds for itself rather than downloading one build job's output: on
  # a warm PR run a mostly-cached build is shorter than an extra job's setup,
  # upload and download, and it keeps no job-to-job contract over hundreds of
  # MB. The shards are named apart from the gate below.
  test:
    name: Test shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      # A red shard does not cancel the others, so one run names every failing
      # test rather than only the first shard's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Turbo reads TURBO_CACHE_DIR, and so do the cache steps and
      # scripts/prune-turbo-cache.mjs, so the path restored, the path turbo
      # writes and the path saved cannot disagree.
      TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo/cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install

      # Turbo's cache persists between runs (#1492). Only a push to master or
      # release/* saves it, and only a PR run reads it. GitHub lets a PR run
      # restore what its base branch saved, and it would look in the PR's own
      # scope first: a PR that saved a cache of its own would keep restoring
      # that one after a rebase onto a newer master, and its entries would
      # crowd master's out of the repository's 10 GB. So PR runs save nothing,
      # and every PR run starts from the newest master cache; only what the PR
      # changed rebuilds. A cache entry cannot be overwritten, so every save
      # gets a new key and a restore takes the newest one under the prefix.
      # The runner's OS and architecture are in the key because a build's
      # outputs depend on them while turbo's hashes do not: the plugins'
      # `bin/` npm install fetches platform binaries.
      - name: Restore the turbo cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: turbo-tests-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-tests-${{ runner.os }}-${{ runner.arch }}-

      # On a PR, turbo only reads the cache: everything the PR did not touch
      # is a hit, and nothing is written, since nothing is saved. That is only
      # correct while every task's declared inputs cover what it reads, which
      # scripts/turbo-inputs.test.mjs guards (#1491). On a push to master or
      # release/*, turbo only writes: every task runs, so the post-merge check
      # stays a full build of the merged tree (#1070) and a stale hit a PR got
      # away with shows red there. The env var rather than a flag keeps
      # `pnpm build` the developer's command. The run summary names every
      # task hash the build used, which is what the prune below keeps.
      - name: Build
        run: pnpm build
        env:
          TURBO_CACHE: ${{ github.event_name == 'pull_request' && 'local:r' || 'local:w' }}
          TURBO_RUN_SUMMARY: 'true'

      # A push run saves, from shard 1 alone since all three would race for
      # one key. A push run restores nothing, so the cache holds only what this
      # build wrote; the prune keeps it that way should a restore ever be
      # added, and it refuses, skipping the save, when none of the build's
      # hashes has an entry in TURBO_CACHE_DIR: turbo writing somewhere else
      # would otherwise save an empty cache unnoticed. Both steps run before
      # the tests, so a red test does not discard a good build, and only after
      # a successful build: a failed turbo run's summary lists only the tasks
      # it reached. A refusal is housekeeping, not a test result, so
      # `continue-on-error` keeps it from turning the required check red; the
      # step's outcome stays `failure` and the save is skipped.
      - name: Prune the turbo cache to this build
        id: prune
        if: matrix.shard == 1 && github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/prune-turbo-cache.mjs

      - name: Save the turbo cache
        if: matrix.shard == 1 && github.event_name != 'pull_request' && steps.prune.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: turbo-tests-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      # The root script keeps `--configLoader native`; pnpm appends the flag.
      - run: pnpm test --shard=${{ matrix.shard }}/3

  # The `Protect master` ruleset requires a check named exactly `Run tests`,
  # and matrix jobs get suffixed names, so this job is that check: it passes
  # only when every shard passed. `if: always()` is load-bearing. Without it a
  # failed or cancelled shard makes this job SKIPPED, and GitHub treats a
  # skipped required check as satisfied — a red shard would merge. With it the
  # job always runs and fails on any result but success: failure, cancelled
  # and skipped alike. It also runs, and fails, on a run cancelled because a
  # newer push superseded it (cancel-superseded.yml). That red sits on an old
  # head, unless the PR is force-pushed back to that earlier commit, which
  # leaves it on the current head beside a green rerun; re-run the
  # cancelled workflow if the merge gate then refuses. Do not narrow this to
  # `!cancelled()`: a cancelled run at the current head would then leave this
  # check skipped, which counts as passing.
  gate:
    name: Run tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test shards: $RESULT"
          test "$RESULT" = success
