name: Release - Build Plugins

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

# All three plugins share one build pipeline (install → build → prune) that
# produces every plugin's self-contained bin/ folder in a single pass, so the
# build runs ONCE here. Packing is a cheap per-plugin zip, so the three packs
# run sequentially in this same job instead of fanning out into a matrix that
# would rebuild the whole monorepo once per plugin. Adding a future plugin is
# one entry in the $plugins array below plus its upload step.
#
# Stream Deck and Mirabox share the com.iracedeck.sd.core UUID, so both pack to
# the same com.iracedeck.sd.core.streamDeckPlugin filename — packing each into
# its own -o subdir keeps them from colliding in this single working directory.
jobs:
  build-and-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      # The pinned Node, as every other workflow: a bare `24` builds the release
      # on whichever Node 24 is newest that day (#1513).
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # node-gyp downloads Node's headers and node.lib from nodejs.org the
      # first time anything compiles. Left to the build, the two native addons
      # fetch them concurrently on the critical path, and each plugin's bin/
      # install compiles keysender too; from the runner that download has
      # taken minutes and once failed the build outright (#1513). Fetching
      # them once here, with a time limit per attempt and retries, leaves a
      # warm cache that every later node-gyp uses without a request. npm's own
      # node-gyp, which builds keysender, reads the same cache directory.
      # `$p.Handle` is read so that ExitCode is populated after WaitForExit; a
      # killed attempt is waited for, so the next one does not meet its open
      # files. A slow download that still finished took 173 s, hence 240 s.
      - name: Fetch node-gyp headers
        shell: pwsh
        timeout-minutes: 13
        run: |
          $gyp = "packages/iracing-native/node_modules/node-gyp/bin/node-gyp.js"
          if (-not (Test-Path $gyp)) { throw "node-gyp not found at $gyp; is it still a devDependency of iracing-native?" }
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            $p = Start-Process node -ArgumentList $gyp, "install" -NoNewWindow -PassThru
            $null = $p.Handle
            if ($p.WaitForExit(240000)) {
              if ($p.ExitCode -eq 0) { exit 0 }
              Write-Host "::warning::node-gyp install failed (exit $($p.ExitCode)), attempt $attempt of $attempts"
            } else {
              $p.Kill($true)
              $p.WaitForExit()
              Write-Host "::warning::node-gyp install timed out after 240 s, attempt $attempt of $attempts"
            }
          }
          throw "Could not fetch the node-gyp headers in $attempts attempts"

      # Outside a Visual Studio developer prompt, node-gyp finds Visual Studio
      # by starting Windows PowerShell for `Get-Module -ListAvailable` and
      # `Get-VSSetupInstance`, which took 100 s on this image, once per native
      # addon and again for keysender in each plugin's bin/ install (#1513).
      # With VCINSTALLDIR set it uses that installation and skips the search,
      # and VSCMD_VER and WindowsSDKVersion are the rest of what it then reads.
      # So the three are taken from VsDevCmd here and exported to later steps;
      # turbo.json passes them through to the build tasks, which would
      # otherwise not see them.
      - name: Point node-gyp at Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "vswhere found no Visual Studio with the x64 C++ tools" }
          $names = "VCINSTALLDIR", "VSCMD_VER", "WindowsSDKVersion"
          $vars = @{}
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 -no_logo && set" | ForEach-Object {
            if ($_ -match "^($($names -join '|'))=(.*)$") { $vars[$matches[1]] = $matches[2] }
          }
          foreach ($name in $names) {
            if (-not $vars[$name]) { throw "VsDevCmd did not set $name" }
            Write-Host "$name=$($vars[$name])"
            "$name=$($vars[$name])" >> $env:GITHUB_ENV
          }

      - name: Build
        run: pnpm build

      # Every published voice is packed and checked against its committed
      # catalog entry on every run; the archive is attached to its
      # voices-<id>-<version> release only on a version tag (#1116). This
      # must sit between Build and the prune below: the packer's fflate and
      # ffmpeg-static are devDependencies, and Build has just warmed the
      # encode cache, so packing costs seconds rather than a re-encode.
      - name: Publish voice packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-voice-packs.mjs ${{ startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/voices-') && '--publish' || '' }}

      # `always()`: the run whose archive is worth inspecting is the one where
      # the runner did NOT reproduce the committed bytes, and that run fails.
      - name: Upload voice-pack artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voice-packs
          path: packed/voice-packs/*.zip
          if-no-files-found: ignore

      - name: Remove dev dependencies
        run: pnpm install --prod --no-frozen-lockfile

      - name: Pack plugins
        shell: pwsh
        run: |
          # Each plugin packs from its built .sdPlugin/.ulanziPlugin folder into
          # its own output subdir (-o), then the produced <name>.streamDeckPlugin
          # is moved to the canonical output name under packed/.
          #   - Stream Deck (Elgato): keep manifest validation (no flags).
          #   - Mirabox: manifest isn't Elgato-valid, so skip validation.
          #   - Ulanzi: a .ulanziPlugin folder; the cli packs it but can't derive
          #     the name, emitting undefined.streamDeckPlugin which we rename to a
          #     .zip-suffixed name so the download is self-describing (#692). A
          #     committed .sdignore strips native-module build cruft (~41 MB → ~7 MB).
          #     The cli pads the manifest Version to x.y.z.0 inside the zip, the
          #     one form the Ulanzi marketplace refuses, so the committed x.y.z
          #     is read BEFORE packing (pack rewrites the file on disk too) and
          #     written back into the zip afterwards (#1298).
          $plugins = @(
            @{ Name = "stream-deck"; Path = "packages/iracing-plugin-stream-deck/com.iracedeck.sd.core.sdPlugin"; Output = "com.iracedeck.sd.core.streamDeckPlugin"; Flags = @() }
            @{ Name = "mirabox";     Path = "packages/iracing-plugin-mirabox/com.iracedeck.sd.core.sdPlugin";     Output = "com.iracedeck.sd.core.sdPlugin";          Flags = @("--force", "--ignore-validation") }
            @{ Name = "ulanzi";      Path = "packages/iracing-plugin-ulanzi/com.ulanzi.iracedeck.ulanziPlugin";   Output = "com.ulanzi.iracedeck.ulanziPlugin.zip";   Flags = @("--force", "--ignore-validation") }
          )
          $ulanziVersion = (Get-Content -Raw "packages/iracing-plugin-ulanzi/com.ulanzi.iracedeck.ulanziPlugin/manifest.json" | ConvertFrom-Json).Version
          New-Item -ItemType Directory -Force -Path packed | Out-Null
          foreach ($p in $plugins) {
            Write-Host "::group::Pack $($p.Name) plugin"
            $outDir = Join-Path packed $p.Name
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
            $packArgs = @("@elgato/cli@1.7.4", "pack", $p.Path) + $p.Flags + @("-o", $outDir)
            & npx $packArgs
            if ($LASTEXITCODE -ne 0) { throw "Pack failed for $($p.Name) (exit $LASTEXITCODE)" }
            # The cli writes <name>.streamDeckPlugin into the -o subdir; rename it
            # to the canonical output name when they differ (Mirabox/Ulanzi).
            $produced = Get-ChildItem -Path $outDir -Filter *.streamDeckPlugin | Select-Object -First 1
            if (-not $produced) { throw "Pack produced no .streamDeckPlugin file for $($p.Name)" }
            Move-Item -Path $produced.FullName -Destination (Join-Path packed $p.Output) -Force
            Write-Host "::endgroup::"
          }
          node scripts/stamp-ulanzi-package-version.mjs packed/com.ulanzi.iracedeck.ulanziPlugin.zip $ulanziVersion
          if ($LASTEXITCODE -ne 0) { throw "Stamping the Ulanzi package version failed (exit $LASTEXITCODE)" }

      - name: Upload Stream Deck artifact
        uses: actions/upload-artifact@v7
        with:
          name: streamdeck-plugin
          path: packed/com.iracedeck.sd.core.streamDeckPlugin

      - name: Upload Mirabox artifact
        uses: actions/upload-artifact@v7
        with:
          name: iracing-plugin-mirabox
          path: packed/com.iracedeck.sd.core.sdPlugin

      - name: Upload Ulanzi artifact
        uses: actions/upload-artifact@v7
        with:
          name: iracing-plugin-ulanzi
          path: packed/com.ulanzi.iracedeck.ulanziPlugin.zip

      - name: Attach plugins to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/voices-')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            packed/com.iracedeck.sd.core.streamDeckPlugin
            packed/com.iracedeck.sd.core.sdPlugin
            packed/com.ulanzi.iracedeck.ulanziPlugin.zip
