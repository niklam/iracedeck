version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Matches `minimumReleaseAge` in pnpm-workspace.yaml: a version under a day
    # old fails the lockfile policy check on every CI install (#1245).
    cooldown:
      default-days: 1
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Third-party actions are pinned to full commit hashes with the release in a
  # trailing comment (`owner/action@<sha> # vX.Y.Z`); Dependabot moves the hash
  # and the comment together (#1663). The cooldown is the only age gate an
  # action release passes before it runs here, so a compromised one usually has
  # a week to be caught. It counts from the release's GitHub Release date when
  # there is one, else the tag's git creator date: the tagger date of an
  # annotated tag, but the commit date of a lightweight one, so a new lightweight
  # tag with no Release on an older commit is offered at once. Security updates
  # skip it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
