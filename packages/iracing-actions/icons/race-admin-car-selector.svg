<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144">
  <desc>{"colors":{"backgroundColor":"#000000","textColor":"#ffffff"},"border":{"enabled":false,"glowEnabled":false,"locked":["enabled","glowEnabled"]}}</desc>
  {{borderDefs}}
  <g>
    <!-- Pure black background (dynamic color for theming + flash effect) -->
    <rect x="0" y="0" width="144" height="144" rx="24" fill="{{backgroundColor}}"/>
{{borderContent}}

    <!-- Optional title (empty by default — the button shows only the number) -->
    {{titleContent}}

    <!-- Big car number (generated in JS; empty when the slot has no car) -->
    {{numberContent}}
  </g>
</svg>
